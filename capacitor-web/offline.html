<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tidak terhubung · MADEBYPAYU POS</title>
    <style>
      /* Halaman lokal di dalam APK, tampil bila server tidak bisa dijangkau.
         Mandiri (tanpa CSS/JS eksternal) karena justru dipakai saat offline. Palet kasir. */
      :root {
        color-scheme: light;
        font-family: ui-sans-serif, system-ui, sans-serif;
        color: #2d241e;
        background: #f7f4ef;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 16px;
        box-sizing: border-box;
      }
      main {
        width: 100%;
        max-width: 420px;
        padding: 32px 24px;
        border: 1px solid #e3dac9;
        border-radius: 12px;
        background: #ffffff;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: 18px;
      }
      p {
        margin: 8px 0 24px;
        font-size: 14px;
        line-height: 1.5;
        color: #736052;
      }
      button {
        width: 100%;
        height: 48px;
        border: 0;
        border-radius: 8px;
        background: #3e2723;
        color: #ffffff;
        font: inherit;
        font-weight: 600;
        font-size: 16px;
      }
      button:focus-visible {
        outline: 2px solid #5c4033;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Tidak dapat terhubung ke server</h1>
      <p>Periksa koneksi internet tablet, lalu coba lagi. Transaksi belum bisa dilakukan selama offline.</p>
      <button type="button" id="retry">Coba lagi</button>
    </main>
    <script>
      document.getElementById('retry').addEventListener('click', function () {
        window.location.href = 'https://madebypayu.shop/cashier';
      });
    </script>
  </body>
</html>
